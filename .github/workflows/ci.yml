name: ci

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch main for size and version checks
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true

      - name: Syntax
        run: |
          set -e
          for f in *.js tools/*.js tests/*.js; do node --check "$f"; done

      - name: Smoke test
        run: node tests/smoke.js

      - name: Donation links
        run: node tests/donate.js

      - name: Anonymous usage counters
        run: node tests/usage.js

      - name: Share card
        run: node tests/share-card.js

      - name: Seeded market
        run: node tests/seeded-market.js

      - name: Daily candle and challenge links
        run: node tests/daily.js

      - name: Daily pack
        run: node tests/daily-pack.js

      - name: Versus simulation
        run: node tests/mp-sim.js

      - name: Award ids
        run: node tests/award-ids.js

      - name: Persisted awards
        run: node tests/persist-awards.js

      - name: Military aid offer
        run: node tests/aid-offer.js

      - name: Outcome art lookup
        run: node tests/post-art.js

      - name: Battle tutorial unlock
        run: node tests/battle-tut.js

      - name: Halving rainbow
        run: node tests/halving-rainbow.js

      - name: Halving v4 (x3 earnings, sfx, speed, shake, no chess)
        run: node tests/halving-v4.js

      - name: Keyboard nav, trades and pause
        run: node tests/keyboard.js

      - name: Halving theme, bull speed and duration
        run: node tests/halving-theme.js

      - name: i18n audit
        run: node tools/i18n-audit.js

      - name: Startup JS budget
        run: node docs/perf/check-budget.mjs

      - name: Service worker simulation
        run: node tests/sw-sim.js

      - name: Headless boot (uses the runner's preinstalled Chrome; skips if none)
        run: node tests/boot.js
